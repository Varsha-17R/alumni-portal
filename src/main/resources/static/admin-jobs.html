<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Jobs - AlumniConnect</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #17233c;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */

        .sidebar {
            width: 235px;
            background: #14233d;
            color: white;
            padding: 25px 14px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            margin: 0 12px 35px;
        }

        .menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px 18px;
            margin-bottom: 7px;
            border-radius: 10px;
            font-size: 15px;
        }

        .menu a:hover,
        .menu a.active {
            background: #2867e8;
        }

        /* Main */

        .main {
            margin-left: 235px;
            width: calc(100% - 235px);
            padding: 35px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 6px;
        }

        .header p {
            color: #6f7b91;
        }

        .admin-badge {
            background: white;
            padding: 12px 20px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            font-weight: bold;
        }

        /* Card */

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-header h2 {
            font-size: 22px;
        }

        .search-box {
            padding: 11px 15px;
            width: 280px;
            border: 1px solid #d8deea;
            border-radius: 8px;
            outline: none;
        }

        .search-box:focus {
            border-color: #2867e8;
        }

        /* Table */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f1f4fa;
            text-align: left;
            padding: 15px;
            font-size: 14px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #edf0f5;
            font-size: 14px;
        }

        tr:hover {
            background: #fafbfe;
        }

        /* Status */

        .status {
            font-weight: bold;
        }

        .approved {
            color: #198754;
        }

        .pending {
            color: #f59e0b;
        }

        .rejected {
            color: #dc3545;
        }

        /* Buttons */

        .approve-btn {
            background: #198754;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .approve-btn:hover {
            background: #157347;
        }

        .reject-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 5px;
        }

        .reject-btn:hover {
            background: #bb2d3b;
        }

        .delete-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 5px;
        }

        .delete-btn:hover {
            background: #495057;
        }

        .message {
            text-align: center;
            padding: 25px;
            color: #6f7b91;
        }

        /* Mobile */

        @media (max-width: 768px) {

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                width: calc(100% - 190px);
                padding: 20px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .search-box {
                width: 100%;
            }

        }

    </style>

</head>


<body>

<div class="layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            🎓 AlumniConnect
        </div>

        <nav class="menu">

            <a href="/admin.html">
                🏠 Dashboard
            </a>

            <a href="/admin-users.html">
                👥 Manage Users
            </a>

            <a href="/admin-alumni.html">
                🎓 Verify Alumni
            </a>

            <a href="/admin-jobs.html" class="active">
                💼 Manage Jobs
            </a>

            <a href="/admin-events.html">
                🗓️ Manage Events
            </a>

            <a href="/mentorship.html">
                🤝 Mentorship Requests
            </a>

            <a href="/messages.html">
                💬 Messages
            </a>

            <a href="/admin.html">
                📊 Reports
            </a>

            <a href="/logout">
                🚪 Logout
            </a>

        </nav>

    </aside>


    <!-- Main -->

    <main class="main">

        <div class="header">

            <div>

                <h1>Manage Jobs</h1>

                <p>
                    Review and manage job opportunities
                </p>

            </div>

            <div class="admin-badge">
                👤 Admin
            </div>

        </div>


        <div class="card">

            <div class="card-header">

                <h2>Job Postings</h2>

                <input
                        type="text"
                        id="searchInput"
                        class="search-box"
                        placeholder="Search jobs..."
                        onkeyup="searchJobs()"
                >

            </div>


            <div id="message" class="message">
                Loading jobs...
            </div>


            <div class="table-container">

                <table id="jobsTable" style="display:none;">

                    <thead>

                    <tr>

                        <th>ID</th>

                        <th>Job Title</th>

                        <th>Company</th>

                        <th>Location</th>

                        <th>Posted By</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                    </thead>


                    <tbody id="jobsBody"></tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<script>

    let allJobs = [];


    // Load jobs

    async function loadJobs() {

        try {

            const response =
                await fetch("/api/jobs");

            if (!response.ok) {

                if (response.status === 403) {

                    throw new Error(
                        "Access denied. Admin permission required."
                    );

                }

                throw new Error(
                    "Unable to load jobs."
                );

            }


            allJobs = await response.json();

            displayJobs(allJobs);

        }

        catch (error) {

            document.getElementById("message")
                .textContent = error.message;

        }

    }


    // Display jobs

    function displayJobs(jobs) {

        const tbody =
            document.getElementById("jobsBody");

        const table =
            document.getElementById("jobsTable");

        const message =
            document.getElementById("message");


        tbody.innerHTML = "";


        if (jobs.length === 0) {

            table.style.display = "none";

            message.style.display = "block";

            message.textContent =
                "No jobs found.";

            return;

        }


        message.style.display = "none";

        table.style.display = "table";


        jobs.forEach(job => {

            const row =
                document.createElement("tr");


            const status =
                job.status || "PENDING";


            let statusClass = "pending";


            if (status === "APPROVED") {
                statusClass = "approved";
            }

            else if (status === "REJECTED") {
                statusClass = "rejected";
            }


            row.innerHTML = `

                <td>
                    ${job.id}
                </td>

                <td>
                    ${escapeHtml(job.title || "")}
                </td>

                <td>
                    ${escapeHtml(job.company || "")}
                </td>

                <td>
                    ${escapeHtml(job.location || "N/A")}
                </td>

                <td>
                    ${escapeHtml(
                job.postedBy?.name ||
                job.postedBy?.email ||
                "N/A"
            )}
                </td>

                <td>

                    <span class="status ${statusClass}">
                        ${status}
                    </span>

                </td>

                <td>

                    ${
                status !== "APPROVED"

                    ?

                    `<button
                            class="approve-btn"
                            onclick="approveJob(${job.id})">
                            Approve
                        </button>`

                    :

                    ""
            }


                    ${
                status !== "REJECTED"

                    ?

                    `<button
                            class="reject-btn"
                            onclick="rejectJob(${job.id})">
                            Reject
                        </button>`

                    :

                    ""
            }


                    <button
                        class="delete-btn"
                        onclick="deleteJob(${job.id})">
                        Delete
                    </button>

                </td>

            `;


            tbody.appendChild(row);

        });

    }


    // Search jobs

    function searchJobs() {

        const search =
            document.getElementById("searchInput")
                .value
                .toLowerCase();


        const filtered =
            allJobs.filter(job =>

                (job.title || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (job.company || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (job.location || "")
                    .toLowerCase()
                    .includes(search)

            );


        displayJobs(filtered);

    }


    // Approve job

    async function approveJob(id) {

        if (!confirm(
            "Are you sure you want to approve this job?"
        )) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/jobs/${id}/approve`,
                    {
                        method: "PUT"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to approve job."
                );

            }


            alert(
                "Job approved successfully."
            );


            loadJobs();

        }

        catch (error) {

            alert(error.message);

        }

    }


    // Reject job

    async function rejectJob(id) {

        if (!confirm(
            "Are you sure you want to reject this job?"
        )) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/jobs/${id}/reject`,
                    {
                        method: "PUT"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to reject job."
                );

            }


            alert(
                "Job rejected successfully."
            );


            loadJobs();

        }

        catch (error) {

            alert(error.message);

        }

    }


    // Delete job

    async function deleteJob(id) {

        if (!confirm(
            "Are you sure you want to delete this job?"
        )) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/jobs/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to delete job."
                );

            }


            alert(
                "Job deleted successfully."
            );


            loadJobs();

        }

        catch (error) {

            alert(error.message);

        }

    }


    // Prevent HTML injection

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // Load page

    loadJobs();

</script>

</body>

</html>
