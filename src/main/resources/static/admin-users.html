<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Users - AlumniConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #17233c;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 235px;
            background: #14233d;
            color: white;
            padding: 25px 14px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            margin: 0 12px 35px;
        }

        .logo span {
            margin-right: 6px;
        }

        .menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px 18px;
            margin-bottom: 7px;
            border-radius: 10px;
            font-size: 15px;
        }

        .menu a:hover,
        .menu a.active {
            background: #2867e8;
        }

        /* Main */
        .main {
            margin-left: 235px;
            width: calc(100% - 235px);
            padding: 35px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 6px;
        }

        .header p {
            color: #6f7b91;
        }

        .admin-badge {
            background: white;
            padding: 12px 20px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            font-weight: bold;
        }

        /* Card */
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-header h2 {
            font-size: 22px;
        }

        .search-box {
            padding: 11px 15px;
            width: 260px;
            border: 1px solid #d8deea;
            border-radius: 8px;
            outline: none;
        }

        .search-box:focus {
            border-color: #2867e8;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f1f4fa;
            text-align: left;
            padding: 15px;
            font-size: 14px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #edf0f5;
            font-size: 14px;
        }

        tr:hover {
            background: #fafbfe;
        }

        .role {
            font-weight: bold;
            color: #2867e8;
        }

        .role.admin {
            color: #8a3ffc;
        }

        .role.alumni {
            color: #198754;
        }

        .role.student {
            color: #2867e8;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 13px;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #bb2d3b;
        }

        .message {
            text-align: center;
            padding: 25px;
            color: #6f7b91;
        }

        /* Mobile */
        @media (max-width: 768px) {

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                width: calc(100% - 190px);
                padding: 20px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .search-box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            🎓 AlumniConnect
        </div>

        <nav class="menu">

            <a href="/admin.html">
                🏠 Dashboard
            </a>

            <a href="/admin-users.html" class="active">
                👥 Manage Users
            </a>

            <a href="/admin-alumni.html">
                🎓 Verify Alumni
            </a>

            <a href="/admin-jobs.html">
                💼 Manage Jobs
            </a>

            <a href="/admin-events.html">
                🗓️ Manage Events
            </a>

            <a href="/mentorship.html">
                🤝 Mentorship Requests
            </a>

            <a href="/messages.html">
                💬 Messages
            </a>

            <a href="/admin.html">
                📊 Reports
            </a>

            <a href="/logout">
                🚪 Logout
            </a>

        </nav>

    </aside>


    <!-- Main Content -->
    <main class="main">

        <div class="header">

            <div>
                <h1>Manage Users</h1>
                <p>View and manage registered AlumniConnect users</p>
            </div>

            <div class="admin-badge">
                👤 Admin
            </div>

        </div>


        <div class="card">

            <div class="card-header">

                <h2>Registered Users</h2>

                <input
                        type="text"
                        id="searchInput"
                        class="search-box"
                        placeholder="Search users..."
                        onkeyup="searchUsers()"
                >

            </div>


            <div id="message" class="message">
                Loading users...
            </div>


            <div class="table-container">

                <table id="usersTable" style="display:none;">

                    <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Role</th>
                        <th>Action</th>
                    </tr>

                    </thead>

                    <tbody id="usersBody"></tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<script>

    let allUsers = [];


    // Load users
    async function loadUsers() {

        try {

            const response = await fetch("/api/users");

            if (!response.ok) {

                if (response.status === 403) {
                    throw new Error("Access denied. Admin permission required.");
                }

                throw new Error("Unable to load users.");
            }

            allUsers = await response.json();

            displayUsers(allUsers);

        } catch (error) {

            document.getElementById("message").textContent =
                error.message;

        }

    }


    // Display users
    function displayUsers(users) {

        const tbody = document.getElementById("usersBody");
        const table = document.getElementById("usersTable");
        const message = document.getElementById("message");

        tbody.innerHTML = "";

        if (users.length === 0) {

            table.style.display = "none";

            message.textContent = "No users found.";

            return;
        }

        message.style.display = "none";
        table.style.display = "table";


        users.forEach(user => {

            const row = document.createElement("tr");

            let roleClass = "";

            if (user.role === "ADMIN") {
                roleClass = "admin";
            }
            else if (user.role === "ALUMNI") {
                roleClass = "alumni";
            }
            else {
                roleClass = "student";
            }


            row.innerHTML = `

                <td>${user.id}</td>

                <td>${escapeHtml(user.name || "")}</td>

                <td>${escapeHtml(user.email || "")}</td>

                <td>${escapeHtml(user.phone || "N/A")}</td>

                <td>
                    <span class="role ${roleClass}">
                        ${user.role}
                    </span>
                </td>

                <td>

                    ${
                user.role === "ADMIN"
                    ?
                    "<span style='color:#6f7b91;'>Protected</span>"
                    :
                    `<button
                            class="delete-btn"
                            onclick="deleteUser(${user.id})">
                            Delete
                        </button>`
            }

                </td>

            `;

            tbody.appendChild(row);

        });

    }


    // Search users
    function searchUsers() {

        const search =
            document.getElementById("searchInput")
                .value
                .toLowerCase();

        const filteredUsers = allUsers.filter(user =>

            (user.name || "")
                .toLowerCase()
                .includes(search)

            ||

            (user.email || "")
                .toLowerCase()
                .includes(search)

            ||

            (user.role || "")
                .toLowerCase()
                .includes(search)

        );

        displayUsers(filteredUsers);

    }


    // Delete user
    async function deleteUser(id) {

        const confirmed =
            confirm("Are you sure you want to delete this user?");

        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(`/api/users/${id}`, {
                    method: "DELETE"
                });


            if (!response.ok) {

                if (response.status === 403) {
                    alert("Access denied. Admin permission required.");
                    return;
                }

                throw new Error("Failed to delete user.");

            }


            alert("User deleted successfully.");

            loadUsers();

        }
        catch (error) {

            alert(error.message);

        }

    }


    // Prevent HTML injection in displayed values
    function escapeHtml(value) {

        return value
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // Load when page opens
    loadUsers();

</script>

</body>
</html>
