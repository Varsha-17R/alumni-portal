<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - Alumni Portal</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 65px;
            background: #2563eb;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logout {
            background: white;
            color: #2563eb;

            border: none;
            padding: 10px 18px;

            border-radius: 6px;
            cursor: pointer;

            font-weight: bold;
        }

        .logout:hover {
            background: #e8f0ff;
        }

        /* ================= CONTAINER ================= */

        .container {
            display: flex;
            min-height: calc(100vh - 65px);
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            width: 230px;
            background: white;

            padding: 25px 15px;

            box-shadow: 2px 0 8px rgba(0,0,0,0.08);
        }

        .sidebar h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .menu-item {
            display: block;

            padding: 13px 15px;
            margin-bottom: 8px;

            color: #444;
            text-decoration: none;

            border-radius: 6px;
        }

        .menu-item:hover {
            background: #e8f0ff;
            color: #2563eb;
        }

        .menu-item.active {
            background: #e8f0ff;
            color: #2563eb;
            font-weight: bold;
        }

        /* ================= MAIN ================= */

        .main {
            flex: 1;
            padding: 35px;
        }

        /* ================= PROFILE CARD ================= */

        .profile-card {
            background: white;

            max-width: 900px;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .profile-header {
            margin-bottom: 25px;

            border-bottom: 1px solid #ddd;

            padding-bottom: 20px;
        }

        .profile-header h1 {
            color: #222;
            margin-bottom: 8px;
        }

        .profile-header p {
            color: #666;
        }

        /* ================= PROFILE GRID ================= */

        .profile-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }

        .profile-item {
            background: #f8fafc;

            padding: 18px;

            border-radius: 8px;

            border: 1px solid #edf0f4;
        }

        .profile-item label {
            display: block;

            color: #777;

            font-size: 14px;

            margin-bottom: 7px;
        }

        .profile-item span {
            color: #222;

            font-size: 16px;

            font-weight: bold;

            word-break: break-word;
        }

        /* ================= BUTTONS ================= */

        .button-area {
            margin-top: 25px;

            display: flex;
            gap: 10px;
        }

        .button {
            display: inline-block;

            padding: 10px 18px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            text-decoration: none;

            font-size: 14px;
        }

        .edit-button {
            background: #2563eb;
            color: white;
        }

        .edit-button:hover {
            background: #1d4ed8;
        }

        .save-button {
            background: #16a34a;
            color: white;
        }

        .save-button:hover {
            background: #15803d;
        }

        .cancel-button {
            background: #374151;
            color: white;
        }

        .cancel-button:hover {
            background: #1f2937;
        }

        .back-button {
            background: #2563eb;
            color: white;
        }

        .back-button:hover {
            background: #1d4ed8;
        }

        /* ================= FORM ================= */

        .form-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #555;

            font-size: 14px;

            margin-bottom: 7px;

            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 6px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #2563eb;

            box-shadow: 0 0 0 2px
            rgba(37, 99, 235, 0.1);
        }

        .form-group textarea {
            resize: vertical;

            min-height: 80px;
        }

        /* ================= MESSAGES ================= */

        .message {
            padding: 20px;

            background: #f8fafc;

            border-radius: 8px;

            color: #555;
        }

        .error-message {
            padding: 20px;

            background: #ffebee;

            border: 1px solid #ffcdd2;

            border-radius: 8px;

            color: #c62828;

            line-height: 1.7;
        }

        .success-message {
            padding: 12px 15px;

            background: #e8f5e9;

            border: 1px solid #c8e6c9;

            border-radius: 8px;

            color: #2e7d32;

            margin-bottom: 20px;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .sidebar {
                width: 180px;
            }

            .profile-grid,
            .form-grid {
                grid-template-columns: 1fr;
            }

            .main {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<div class="navbar">

    <div class="logo">
        🎓 Alumni Portal
    </div>

    <form action="/logout" method="post">

        <button
                class="logout"
                type="submit"
                onclick="logoutUser()">

            Logout

        </button>

    </form>

</div>


<!-- ================= CONTAINER ================= -->

<div class="container">


    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <h3>Menu</h3>

        <a href="/dashboard.html"
           class="menu-item">

            🏠 Dashboard

        </a>

        <a href="/profile.html"
           class="menu-item active">

            👤 My Profile

        </a>

        <a href="/alumni.html"
           class="menu-item">

            🎓 Alumni

        </a>

        <a href="/mentorship.html"
           class="menu-item">

            🤝 Mentorship

        </a>

        <a href="/jobs.html"
           class="menu-item">

            💼 Jobs

        </a>

        <a href="/applications.html"
           class="menu-item">

            📄 Applications

        </a>

        <a href="/events.html"
           class="menu-item">

            📅 Events

        </a>

        <a href="/messages.html"
           class="menu-item">

            💬 Messages

        </a>

    </div>


    <!-- ================= MAIN ================= -->

    <div class="main">

        <div class="profile-card">


            <!-- HEADER -->

            <div class="profile-header">

                <h1>
                    My Profile 👤
                </h1>

                <p>
                    Your professional and educational information
                </p>

            </div>


            <!-- PROFILE CONTENT -->

            <div id="profileContainer">

                <div class="message">
                    Loading profile...
                </div>

            </div>


            <div class="button-area">

                <a href="/dashboard.html"
                   class="button back-button">

                    ← Back to Dashboard

                </a>

            </div>


        </div>

    </div>

</div>


<script>

    let currentUser = null;
    let currentProfile = null;


    // =========================================================
    // LOAD PROFILE
    // =========================================================

    async function loadProfile() {

        const container =
            document.getElementById("profileContainer");


        const loggedInEmail =
            sessionStorage.getItem("loggedInEmail");


        if (!loggedInEmail) {

            container.innerHTML = `

                <div class="error-message">

                    <strong>Please login first.</strong>

                    <br><br>

                    No login email was found.

                </div>

            `;

            return;
        }


        try {

            // -------------------------------------------------
            // GET USERS
            // -------------------------------------------------

            const usersResponse =
                await fetch("/api/users");


            if (!usersResponse.ok) {

                throw new Error(
                    "Unable to load users."
                );

            }


            const users =
                await usersResponse.json();


            // -------------------------------------------------
            // FIND CURRENT USER
            // -------------------------------------------------

            currentUser =
                users.find(
                    user =>
                        user.email &&
                        user.email.toLowerCase() ===
                        loggedInEmail.toLowerCase()
                );


            if (!currentUser) {

                container.innerHTML = `

                    <div class="error-message">

                        <strong>User not found.</strong>

                        <br><br>

                        Email:
                        <strong>
                            ${loggedInEmail}
                        </strong>

                    </div>

                `;

                return;
            }


            // -------------------------------------------------
            // GET PROFILE
            // -------------------------------------------------

            const profileResponse =
                await fetch(
                    `/api/profiles/user/${currentUser.id}`
                );


            if (!profileResponse.ok) {

                throw new Error(
                    "Unable to load profile."
                );

            }


            currentProfile =
                await profileResponse.json();


            displayProfile();

        }

        catch (error) {

            console.error(
                "Profile loading error:",
                error
            );


            container.innerHTML = `

                <div class="error-message">

                    <strong>
                        Unable to load your profile.
                    </strong>

                    <br><br>

                    ${error.message}

                </div>

            `;

        }

    }


    // =========================================================
    // DISPLAY PROFILE
    // =========================================================

    function displayProfile() {

        const container =
            document.getElementById("profileContainer");


        container.innerHTML = `

            <div class="profile-grid">


                <div class="profile-item">

                    <label>Name</label>

                    <span>
                        ${currentUser.name || "Not provided"}
                    </span>

                </div>


                <div class="profile-item">

                    <label>Email</label>

                    <span>
                        ${currentUser.email || "Not provided"}
                    </span>

                </div>


                <div class="profile-item">

                    <label>Phone</label>

                    <span>
                        ${currentUser.phone || "Not provided"}
                    </span>

                </div>


                <div class="profile-item">

                    <label>Role</label>

                    <span>
                        ${currentUser.role || "Not provided"}
                    </span>

                </div>


                <div class="profile-item">

                    <label>Education</label>

                    <span>
                        ${currentProfile.education || "Not provided"}
                    </span>

                </div>


                <div class="profile-item">

                    <label>Graduation Year</label>

                    <span>
                        ${currentProfile.graduationYear || "Not provided"}
                    </span>

                </div>


                <div class="profile-item">

                    <label>Company</label>

                    <span>
                        ${currentProfile.company || "Not provided"}
                    </span>

                </div>


                <div class="profile-item">

                    <label>Job Title</label>

                    <span>
                        ${currentProfile.jobTitle || "Not provided"}
                    </span>

                </div>


                <div class="profile-item">

                    <label>Skills</label>

                    <span>
                        ${currentProfile.skills || "Not provided"}
                    </span>

                </div>


                <div class="profile-item">

                    <label>Location</label>

                    <span>
                        ${currentProfile.location || "Not provided"}
                    </span>

                </div>


            </div>


            <div class="button-area">

                <button
                    class="button edit-button"
                    onclick="showEditForm()">

                    ✏️ Edit Profile

                </button>

            </div>

        `;

    }


    // =========================================================
    // EDIT PROFILE FORM
    // =========================================================

    function showEditForm() {

        const container =
            document.getElementById("profileContainer");


        container.innerHTML = `

            <div class="form-grid">


                <div class="form-group">

                    <label>Education</label>

                    <input
                        type="text"
                        id="education"
                        value="${escapeHtml(
            currentProfile.education || ""
        )}"
                        placeholder="Example: MCA">

                </div>


                <div class="form-group">

                    <label>Graduation Year</label>

                    <input
                        type="text"
                        id="graduationYear"
                        value="${escapeHtml(
            currentProfile.graduationYear || ""
        )}"
                        placeholder="Example: 2026">

                </div>


                <div class="form-group">

                    <label>Company</label>

                    <input
                        type="text"
                        id="company"
                        value="${escapeHtml(
            currentProfile.company || ""
        )}"
                        placeholder="Company name">

                </div>


                <div class="form-group">

                    <label>Job Title</label>

                    <input
                        type="text"
                        id="jobTitle"
                        value="${escapeHtml(
            currentProfile.jobTitle || ""
        )}"
                        placeholder="Example: Software Developer">

                </div>


                <div class="form-group">

                    <label>Skills</label>

                    <textarea
                        id="skills"
                        placeholder="Example: Java, SQL, HTML, CSS">${escapeHtml(
            currentProfile.skills || ""
        )}</textarea>

                </div>


                <div class="form-group">

                    <label>Location</label>

                    <input
                        type="text"
                        id="location"
                        value="${escapeHtml(
            currentProfile.location || ""
        )}"
                        placeholder="Example: Bangalore">

                </div>


            </div>


            <div class="button-area">

                <button
                    class="button save-button"
                    onclick="saveProfile()">

                    💾 Save Profile

                </button>


                <button
                    class="button cancel-button"
                    onclick="displayProfile()">

                    Cancel

                </button>

            </div>

        `;

    }


    // =========================================================
    // SAVE PROFILE
    // =========================================================

    async function saveProfile() {

        const updatedProfile = {

            education:
            document.getElementById("education").value,

            graduationYear:
            document.getElementById("graduationYear").value,

            company:
            document.getElementById("company").value,

            jobTitle:
            document.getElementById("jobTitle").value,

            skills:
            document.getElementById("skills").value,

            location:
            document.getElementById("location").value

        };


        try {

            const response =
                await fetch(
                    `/api/profiles/${currentProfile.id}`,
                    {

                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(updatedProfile)

                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to save profile."
                );

            }


            currentProfile =
                await response.json();


            document.getElementById(
                "profileContainer"
            ).innerHTML = `

                <div class="success-message">

                    ✅ Profile updated successfully!

                </div>

            `;


            setTimeout(() => {

                displayProfile();

            }, 1000);

        }

        catch (error) {

            console.error(
                "Profile update error:",
                error
            );


            alert(
                "Unable to save profile. Please try again."
            );

        }

    }


    // =========================================================
    // ESCAPE HTML
    // =========================================================

    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent = value;

        return div.innerHTML;

    }


    // =========================================================
    // LOGOUT
    // =========================================================

    function logoutUser() {

        sessionStorage.removeItem(
            "loggedInEmail"
        );

    }


    // =========================================================
    // START
    // =========================================================

    loadProfile();

</script>


</body>

</html>
