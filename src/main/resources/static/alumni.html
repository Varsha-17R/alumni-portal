<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Alumni - Alumni Portal</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        .header {
            height: 72px;
            background: #2864e8;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 35px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .logout {
            background: white;
            color: #2864e8;
            border: none;

            padding: 12px 25px;

            border-radius: 6px;

            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .layout {
            display: flex;

            min-height: calc(100vh - 72px);
        }

        .sidebar {
            width: 260px;

            background: white;

            padding: 30px 15px;

            box-shadow:
                    2px 0 8px rgba(0,0,0,0.08);
        }

        .sidebar h2 {
            margin-bottom: 30px;
        }

        .menu {
            display: block;

            text-decoration: none;

            color: #333;

            padding: 15px 20px;

            margin-bottom: 8px;

            border-radius: 8px;

            font-size: 17px;
        }

        .menu:hover {
            background: #eef3ff;
            color: #2864e8;
        }

        .menu.active {
            background: #eef3ff;
            color: #2864e8;

            font-weight: bold;
        }

        .content {
            flex: 1;

            padding: 45px;

            overflow-x: auto;
        }

        .content h1 {
            font-size: 34px;

            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;

            font-size: 18px;

            margin-bottom: 30px;
        }

        .alumni-container {
            background: white;

            border-radius: 12px;

            padding: 30px;

            box-shadow:
                    0 3px 12px rgba(0,0,0,0.08);

            overflow-x: auto;
        }

        .alumni-container h2 {
            margin-bottom: 25px;
        }

        table {
            width: 100%;

            min-width: 700px;

            border-collapse: collapse;
        }

        th {
            background: #eef3f9;

            text-align: left;

            padding: 16px;

            font-size: 16px;

            white-space: nowrap;
        }

        td {
            padding: 16px;

            border-bottom: 1px solid #ddd;

            white-space: nowrap;
        }

        tr:hover {
            background: #f8faff;
        }

        .role {
            color: #2864e8;

            font-weight: bold;
        }

        .message {
            text-align: center;

            padding: 30px;

            color: #666;
        }

        .count {
            color: #2864e8;

            font-weight: bold;
        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<div class="header">

    <div class="logo">
        🎓 Alumni Portal
    </div>

    <button
            class="logout"
            onclick="logout()">

        Logout

    </button>

</div>


<!-- ================= LAYOUT ================= -->

<div class="layout">


    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <h2>Menu</h2>


        <a href="/dashboard.html"
           class="menu">

            🏠 Dashboard

        </a>


        <a href="/profile.html"
           class="menu">

            👤 My Profile

        </a>


        <a href="/alumni.html"
           class="menu active">

            🎓 Alumni

        </a>


        <a href="/mentorship.html"
           class="menu">

            🤝 Mentorship

        </a>


        <a href="/jobs.html"
           class="menu">

            💼 Jobs

        </a>


        <a href="/events.html"
           class="menu">

            🗓️ Events

        </a>


        <a href="/messages.html"
           class="menu">

            💬 Messages

        </a>

    </div>


    <!-- ================= CONTENT ================= -->

    <div class="content">


        <h1>
            Alumni 🎓
        </h1>


        <p class="subtitle">

            Connect with alumni and explore their professional profiles.

        </p>


        <div class="alumni-container">


            <h2>

                Registered Alumni
                (<span id="alumniCount"
                       class="count">0</span>)

            </h2>


            <div id="alumniContent">

                <div class="message">

                    Loading alumni...

                </div>

            </div>


        </div>


    </div>

</div>


<script>

    async function loadAlumni() {

        const container = document.getElementById("alumniContent");
        const countElement = document.getElementById("alumniCount");

        try {

            // ---------------------------------------------------------
            // 1. Get ALL registered alumni users
            // ---------------------------------------------------------

            const usersResponse = await fetch("/api/users/alumni");

            if (!usersResponse.ok) {
                throw new Error("Failed to load alumni users");
            }

            const alumniUsers = await usersResponse.json();


            // ---------------------------------------------------------
            // 2. Get profile information
            // ---------------------------------------------------------

            let profiles = [];

            try {

                const profilesResponse =
                    await fetch("/api/profiles");

                if (profilesResponse.ok) {
                    profiles = await profilesResponse.json();
                }

            } catch (profileError) {

                console.warn(
                    "Could not load profiles:",
                    profileError
                );

            }


            // ---------------------------------------------------------
            // 3. Update alumni count
            // ---------------------------------------------------------

            if (countElement) {
                countElement.textContent = alumniUsers.length;
            }


            // ---------------------------------------------------------
            // 4. Check if no alumni are registered
            // ---------------------------------------------------------

            if (alumniUsers.length === 0) {

                container.innerHTML = `
                    <div class="message">
                        No alumni registered yet.
                    </div>
                `;

                return;
            }


            // ---------------------------------------------------------
            // 5. Create alumni table
            // ---------------------------------------------------------

            let table = `
                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Education</th>
                            <th>Graduation Year</th>
                            <th>Company</th>
                            <th>Job Title</th>
                            <th>Skills</th>
                            <th>Location</th>
                        </tr>
                    </thead>

                    <tbody>
            `;


            // ---------------------------------------------------------
            // 6. Display every registered alumni
            // ---------------------------------------------------------

            alumniUsers.forEach(user => {

                // Find matching profile using user ID
                const profile = profiles.find(
                    p => p.user && p.user.id === user.id
                );


                table += `
                    <tr>

                        <td>${user.id}</td>

                        <td>${user.name || "-"}</td>

                        <td>${user.email || "-"}</td>

                        <td>${user.phone || "-"}</td>

                        <td>
                            ${profile?.education || "-"}
                        </td>

                        <td>
                            ${profile?.graduationYear || "-"}
                        </td>

                        <td>
                            ${profile?.company || "-"}
                        </td>

                        <td>
                            ${profile?.jobTitle || "-"}
                        </td>

                        <td>
                            ${profile?.skills || "-"}
                        </td>

                        <td>
                            ${profile?.location || "-"}
                        </td>

                    </tr>
                `;

            });


            table += `
                    </tbody>
                </table>
            `;


            // ---------------------------------------------------------
            // 7. Display table
            // ---------------------------------------------------------

            container.innerHTML = table;


        } catch (error) {

            console.error(
                "Error loading alumni:",
                error
            );

            container.innerHTML = `
                <div class="message">
                    Unable to load alumni.
                    Please make sure the backend is running.
                </div>
            `;

        }

    }


    // ---------------------------------------------------------
    // LOGOUT
    // ---------------------------------------------------------

    function logout() {

        window.location.href = "/login";

    }


    // ---------------------------------------------------------
    // LOAD ALUMNI WHEN PAGE OPENS
    // ---------------------------------------------------------

    loadAlumni();

</script>

</body>

</html>
