<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Applications - Alumni Portal</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        /* =========================
           HEADER
           ========================= */

        .header {
            height: 72px;
            background: #2864e8;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 35px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .logout {
            background: white;
            color: #2864e8;

            border: none;

            padding: 12px 25px;

            border-radius: 6px;

            font-weight: bold;

            cursor: pointer;
        }

        .logout:hover {
            background: #eef3ff;
        }

        /* =========================
           LAYOUT
           ========================= */

        .layout {
            display: flex;

            min-height: calc(100vh - 72px);
        }

        /* =========================
           SIDEBAR
           ========================= */

        .sidebar {
            width: 260px;

            background: white;

            padding: 30px 15px;

            box-shadow:
                    2px 0 8px rgba(0, 0, 0, 0.08);
        }

        .sidebar h2 {
            margin-bottom: 30px;
        }

        .menu {
            display: block;

            text-decoration: none;

            color: #333;

            padding: 15px 20px;

            margin-bottom: 8px;

            border-radius: 8px;
        }

        .menu:hover,
        .menu.active {

            background: #eef3ff;

            color: #2864e8;

            font-weight: bold;
        }

        /* =========================
           CONTENT
           ========================= */

        .content {

            flex: 1;

            padding: 40px;
        }

        .content h1 {

            font-size: 34px;

            margin-bottom: 10px;
        }

        .subtitle {

            color: #666;

            margin-bottom: 30px;
        }

        /* =========================
           APPLICATION SECTION
           ========================= */

        .applications-section {

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                    0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .applications-section h2 {

            margin-bottom: 25px;
        }

        /* =========================
           APPLICATION GRID
           ========================= */

        .applications-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(350px, 1fr)
                );

            gap: 20px;
        }

        /* =========================
           APPLICATION CARD
           ========================= */

        .application-card {

            border: 1px solid #ddd;

            border-radius: 10px;

            padding: 25px;

            background: #fafafa;
        }

        .application-card:hover {

            box-shadow:
                    0 5px 15px rgba(0, 0, 0, 0.12);
        }

        .job-title {

            font-size: 23px;

            color: #2864e8;

            margin-bottom: 10px;
        }

        .company {

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 15px;
        }

        .job-info {

            margin-bottom: 8px;

            color: #555;
        }

        .applicant {

            margin-top: 18px;

            padding-top: 18px;

            border-top: 1px solid #ddd;
        }

        .applicant-title {

            font-weight: bold;

            margin-bottom: 10px;

            color: #333;
        }

        .applicant-info {

            color: #555;

            line-height: 1.7;
        }

        /* =========================
           STATUS
           ========================= */

        .status {

            display: inline-block;

            margin-top: 18px;

            padding: 8px 14px;

            border-radius: 6px;

            font-weight: bold;

            font-size: 14px;
        }

        .status-pending {

            background: #fff7ed;

            color: #c2410c;

            border: 1px solid #fed7aa;
        }

        .status-accepted {

            background: #dcfce7;

            color: #15803d;

            border: 1px solid #bbf7d0;
        }

        .status-rejected {

            background: #fee2e2;

            color: #b91c1c;

            border: 1px solid #fecaca;
        }

        /* =========================
           BUTTONS
           ========================= */

        .button-row {

            display: flex;

            gap: 10px;

            margin-top: 20px;
        }

        .accept-btn {

            flex: 1;

            background: #16a34a;

            color: white;

            border: none;

            padding: 11px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;
        }

        .accept-btn:hover {

            background: #15803d;
        }

        .reject-btn {

            flex: 1;

            background: #dc2626;

            color: white;

            border: none;

            padding: 11px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;
        }

        .reject-btn:hover {

            background: #b91c1c;
        }

        /* =========================
           MESSAGE
           ========================= */

        .message {

            color: #666;

            padding: 20px 0;
        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<div class="header">

    <div class="logo">

        🎓 Alumni Portal

    </div>


    <button
            class="logout"
            onclick="logout()">

        Logout

    </button>

</div>



<!-- =========================
     MAIN LAYOUT
     ========================= -->

<div class="layout">


    <!-- =========================
         SIDEBAR
         ========================= -->

    <div class="sidebar">

        <h2>Menu</h2>


        <a
                href="/dashboard.html"
                class="menu">

            🏠 Dashboard

        </a>


        <a
                href="/profile.html"
                class="menu">

            👤 My Profile

        </a>


        <a
                href="/alumni.html"
                class="menu">

            🎓 Alumni

        </a>


        <a
                href="/mentorship.html"
                class="menu">

            🤝 Mentorship

        </a>


        <a
                href="/jobs.html"
                class="menu">

            💼 Jobs

        </a>


        <a
                href="/applications.html"
                class="menu active">

            📄 Applications

        </a>


        <a
                href="#"
                class="menu">

            📅 Events

        </a>


        <a
                href="#"
                class="menu">

            💬 Messages

        </a>

    </div>



    <!-- =========================
         CONTENT
         ========================= -->

    <div class="content">


        <h1>

            Job Applications 📄

        </h1>


        <p class="subtitle">

            Review applications submitted
            for your job postings.

        </p>



        <!-- =========================
             APPLICATIONS
             ========================= -->

        <div class="applications-section">


            <h2>

                Applicants

            </h2>


            <div id="applicationsContainer">

                <div class="message">

                    Loading applications...

                </div>

            </div>


        </div>


    </div>

</div>



<script>

    /* =====================================================
       CURRENT ALUMNI
       ===================================================== */

    /*
     * Rahul = Alumni ID 3
     *
     * We are using Rahul temporarily while
     * testing the Alumni application page.
     *
     * Later this will come from the logged-in user.
     */

    const loggedInUserId = 3;


    /* =====================================================
       LOAD APPLICATIONS
       ===================================================== */

    async function loadApplications() {

        const container =
            document.getElementById(
                'applicationsContainer'
            );


        try {

            /*
             * First get all jobs.
             *
             * We need this because the application
             * API gives us applications, while we
             * need to determine which applications
             * belong to Rahul's jobs.
             */

            const jobsResponse =
                await fetch('/api/jobs');


            if (!jobsResponse.ok) {

                throw new Error(
                    'Unable to load jobs'
                );
            }


            const jobs =
                await jobsResponse.json();


            /*
             * Keep only jobs posted by Rahul.
             */

            const myJobs =
                jobs.filter(
                    job =>
                        job.postedBy &&
                        job.postedBy.id === loggedInUserId
                );


            /*
             * If Rahul has no jobs.
             */

            if (myJobs.length === 0) {

                container.innerHTML = `

                <div class="message">

                    You have not posted any jobs yet.

                </div>

            `;

                return;
            }


            /*
             * Get applications for every job
             * posted by Rahul.
             */

            let allApplications = [];


            for (const job of myJobs) {

                const response =
                    await fetch(
                        `/api/applications/job/${job.id}`
                    );


                if (!response.ok) {

                    continue;

                }


                const applications =
                    await response.json();


                /*
                 * Add job information to each
                 * application.
                 */

                applications.forEach(
                    application => {

                        application.jobData = job;

                    }
                );


                allApplications =
                    allApplications.concat(
                        applications
                    );

            }


            displayApplications(
                allApplications
            );


        } catch (error) {

            console.error(error);


            container.innerHTML = `

            <div class="message">

                Unable to load applications.

            </div>

        `;

        }

    }


    /* =====================================================
       DISPLAY APPLICATIONS
       ===================================================== */

    function displayApplications(
        applications
    ) {

        const container =
            document.getElementById(
                'applicationsContainer'
            );


        if (applications.length === 0) {

            container.innerHTML = `

            <div class="message">

                No applications received yet.

            </div>

        `;

            return;

        }


        let html =
            '<div class="applications-grid">';


        applications.forEach(
            application => {


                const job =
                    application.jobData;


                const student =
                    application.student;


                /*
                 * Determine status CSS.
                 */

                let statusClass =
                    'status-pending';


                if (
                    application.status ===
                    'ACCEPTED'
                ) {

                    statusClass =
                        'status-accepted';

                }


                if (
                    application.status ===
                    'REJECTED'
                ) {

                    statusClass =
                        'status-rejected';

                }


                /*
                 * Show Accept/Reject buttons
                 * only for PENDING applications.
                 */

                let buttons = '';


                if (
                    application.status ===
                    'PENDING'
                ) {

                    buttons = `

                    <div class="button-row">

                        <button
                            class="accept-btn"
                            onclick="
                                acceptApplication(
                                    ${application.id}
                                )
                            ">

                            ✓ Accept

                        </button>


                        <button
                            class="reject-btn"
                            onclick="
                                rejectApplication(
                                    ${application.id}
                                )
                            ">

                            ✕ Reject

                        </button>

                    </div>

                `;

                }


                html += `

                <div class="application-card">


                    <div class="job-title">

                        ${job.title}

                    </div>


                    <div class="company">

                        🏢 ${job.company}

                    </div>


                    <div class="job-info">

                        📍 ${job.location}

                    </div>


                    <div class="applicant">


                        <div class="applicant-title">

                            👤 Applicant

                        </div>


                        <div class="applicant-info">

                            <strong>
                                ${student.name}
                            </strong>

                            <br>

                            📧 ${student.email}

                            <br>

                            📱 ${student.phone}

                            <br>

                            🎓 Role:
                            ${student.role}

                        </div>


                    </div>


                    <div
                        class="status ${statusClass}">

                        Status:
                        ${application.status}

                    </div>


                    ${buttons}


                </div>

            `;

            }
        );


        html += '</div>';


        container.innerHTML = html;

    }


    /* =====================================================
       ACCEPT APPLICATION
       ===================================================== */

    async function acceptApplication(
        applicationId
    ) {

        const confirmed =
            confirm(
                'Are you sure you want to accept this application?'
            );


        if (!confirmed) {

            return;

        }


        try {

            const response =
                await fetch(
                    `/api/applications/${applicationId}/accept`,
                    {
                        method: 'PUT'
                    }
                );


            if (!response.ok) {

                throw new Error(
                    'Unable to accept application'
                );

            }


            alert(
                'Application accepted successfully! 🎉'
            );


            /*
             * Refresh applications.
             */

            loadApplications();


        } catch (error) {

            console.error(error);


            alert(
                'Unable to accept application.'
            );

        }

    }


    /* =====================================================
       REJECT APPLICATION
       ===================================================== */

    async function rejectApplication(
        applicationId
    ) {

        const confirmed =
            confirm(
                'Are you sure you want to reject this application?'
            );


        if (!confirmed) {

            return;

        }


        try {

            const response =
                await fetch(
                    `/api/applications/${applicationId}/reject`,
                    {
                        method: 'PUT'
                    }
                );


            if (!response.ok) {

                throw new Error(
                    'Unable to reject application'
                );

            }


            alert(
                'Application rejected.'
            );


            /*
             * Refresh applications.
             */

            loadApplications();


        } catch (error) {

            console.error(error);


            alert(
                'Unable to reject application.'
            );

        }

    }


    /* =====================================================
       LOGOUT
       ===================================================== */

    function logout() {

        window.location.href =
            '/login';

    }


    /* =====================================================
       LOAD WHEN PAGE OPENS
       ===================================================== */

    loadApplications();

</script>


</body>

</html>
